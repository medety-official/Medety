      .coursequiz-prompt-row {
          display: flex;

      .coursequiz-prompt-row .coursequiz-prompt {

      .coursequiz-speak-btn {
          border: 2px solid var(--c-border);
          background-color: var(--c-surface);

      }
      .coursequiz-speak-btn:hover {

          transform: scale(1.05);
      }
      .coursequiz-speak-btn:active {
          transform: scale(0.95);
      }

      /* --- 語源タグ選択（複数選択） --- */
      .coursequiz-tags {
          display: flex;
          flex-wrap: wrap;

      }
      .coursequiz-tag-btn {
          border: 2px solid var(--c-border);

          color: var(--c-text);
          border-radius: 999px;
          padding: 8px 18px;
          font-weight: bold;
          transition: all 0.15s ease;
      }
      .coursequiz-tag-btn.is-selected {
          background-color: var(--c-primary);
          border-color: var(--c-primary);
          color: #fff;
      }
      .coursequiz-tag-btn.is-correct {
          background-color: var(--c-primary) !important;
          border-color: var(--c-primary) !important;
          color: #fff !important;
      }
      .coursequiz-tag-btn.is-wrong {
          background-color: var(--c-warm) !important;

          color: #fff !important;
      }
      .coursequiz-tag-btn:disabled {
          opacity: 1;

      .coursequiz-choice-btn:hover:not(:disabled) {
          border-color: var(--c-primary);
          transform: translateY(-1px);

      .coursequiz-choice-btn.is-correct {
          background-color: var(--c-primary) !important;
          border-color: var(--c-primary) !important;
          color: #fff !important;
      }

          border-color: var(--c-warm) !important;
          color: #fff !important;
      }

      /* --- タイピング --- */
      .coursequiz-typing input {
          font-size: 1.2rem;
          text-align: center;
          border-radius: 1rem;
          border: 2px solid var(--c-border);

      .coursequiz-feedback {

          margin-top: 10px;
      }
      .coursequiz-feedback.is-correct { color: var(--c-primary-dark); }
      .coursequiz-feedback.is-wrong { color: var(--c-warm); }

    <script>
      const cqParams = new URLSearchParams(window.location.search);
      const cqGroup = cqParams.get("group") || "";
      const cqUnit = parseInt(cqParams.get("unit"), 10) || 0;
      const cqSetLabel = cqParams.get("set") || "";
      document.getElementById("setTitle").textContent = cqSetLabel;

      let cqQuestions = [];
      let cqWrongQueue = [];
      let cqRetryAppended = false;
      let cqIndex = 0;
      let cqCorrectCount = 0;
      let cqAnswered = false;
      let cqItemType = "lesson";
      let cqItemLevel = "";
      let cqStreak = 0;

      const cqCheerMessages = ["やったね！", "その調子！", "素晴らしい！", "ナイス！", "いいね！"];

      function escapeHtml(str) {
          return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      function playCardAnim(el, className) {
          if (!el) return;
          el.classList.remove(className);
          void el.offsetWidth;
          el.classList.add(className);
          el.addEventListener("animationend", () => el.classList.remove(className), { once: true });
      }

      function spawnCheerText(text) {
          const layer = document.getElementById("effectLayer");
          if (!layer) return;
          const el = document.createElement("div");
          el.className = "medety-cheer-pop";
          el.textContent = text;
          layer.appendChild(el);
          el.addEventListener("animationend", () => el.remove(), { once: true });
      }

      function updateStreakBadge() {
          const badge = document.getElementById("streakBadge");
          const num = document.getElementById("streakNum");
          if (cqStreak >= 2) {
              num.textContent = cqStreak;
              badge.style.display = "inline-flex";
              playCardAnim(badge, "medety-anim-pop");
          } else {
              badge.style.display = "none";
          }
      }

      async function init() {
          try {
              const data = await loadMedetyData();
              if (!data || !data.words) throw new Error("no data");

              const plan = medetyBuildCoursePlan(data.words, cqGroup);
              const item = plan[cqUnit];
              if (!item) throw new Error("item not found");

              cqItemType = item.type;
              cqItemLevel = item.level;

              if (item.type === "lesson") {
                  cqQuestions = medetyBuildLessonQueue(item.words, data.words, data.etymology);
              } else if (item.type === "review") {
                  cqQuestions = medetyBuildReviewQueue(item.words, data.etymology, COURSE_REVIEW_SIZE);
              } else if (item.type === "test") {
                  cqQuestions = medetyBuildTestQueue(item.words, COURSE_TEST_SIZE);
              }

              if (cqQuestions.length === 0) throw new Error("no questions");

              document.getElementById("remainingCount").textContent = cqQuestions.length;
              document.getElementById("loading").style.display = "none";
              renderQuestion();
          } catch (e) {
              console.error("コース出題の読み込みに失敗:", e);
              document.getElementById("loading").innerHTML = '<div class="loader">読み込みに失敗しました。<a href="index.html">コース一覧に戻る</a></div>';
          }
      }

      function promptLabel(q) {
          if (q.kind === "tagselect") {
              return q.mode === "meaning" ? "当てはまる語源タグの日本語訳をすべて選んでください" : "当てはまる語源タグをすべて選んでください";
          }
          if (q.kind === "choice") return q.promptLang === "en" ? "日本語の意味を選んでください" : "英語の単語を選んでください";
          if (q.kind === "typing") return "英語のつづりを入力してください";
          return "";
      }

      function renderQuestion() {
          const q = cqQuestions[cqIndex];
          cqAnswered = false;
          const area = document.getElementById("questionArea");

          let html = `<div class="coursequiz-prompt-label">${promptLabel(q)}</div>`;
          if (q.promptLang === "en") {
              html += `<div class="coursequiz-prompt-row">`
                    + `<div class="coursequiz-prompt">${escapeHtml(q.prompt)}</div>`
                    + `<button type="button" class="coursequiz-speak-btn" onclick="speakCurrentPrompt()" aria-label="発音を聞く">🔊</button>`
                    + `</div>`;
          } else {
              html += `<div class="coursequiz-prompt">${escapeHtml(q.prompt)}</div>`;
          }

          if (q.kind === "tagselect") {
              html += `<div class="coursequiz-tags" id="tagOptions">`
                    + q.options.map(val => `<button type="button" class="coursequiz-tag-btn" data-value="${escapeHtml(val)}" onclick="toggleTag(this)">${escapeHtml(val)}</button>`).join("")
                    + `</div>`
                    + `<button type="button" class="btn btn-primary rounded-pill w-100" id="submitBtn" onclick="submitTagAnswer()">けってい ➔</button>`;
          } else if (q.kind === "choice") {
              html += `<div class="coursequiz-choices">`
                    + q.options.map((opt, i) => `<button type="button" class="coursequiz-choice-btn" onclick="submitChoiceAnswer(${i})">${escapeHtml(opt)}</button>`).join("")
                    + `</div>`;
          } else if (q.kind === "typing") {
              html += `<form class="coursequiz-typing" onsubmit="event.preventDefault(); submitTypingAnswer();">
                          <input type="text" id="typingInput" class="form-control" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="英単語を入力">
                          <button type="submit" class="btn btn-primary rounded-pill mt-3 w-100">こたえる ➔</button>
                       </form>`;
          }

          html += `<div id="feedbackArea" class="mt-3"></div>`;
          area.innerHTML = html;

          playCardAnim(document.getElementById("questionArea"), "medety-anim-pop");
          if (q.kind === "typing") document.getElementById("typingInput").focus();
          if (q.promptLang === "en") speakCurrentPrompt();
      }

      function speakCurrentPrompt() {
          const q = cqQuestions[cqIndex];
          if (q && q.promptLang === "en") medetySpeak(q.prompt);
      }

      function toggleTag(btn) {
          if (cqAnswered) return;
          btn.classList.toggle("is-selected");
      }

      function correctAnswerText(q) {
          if (q.kind === "tagselect") return q.correctAnswers.join(" ・ ") || "（なし）";
          return q.correctAnswer;
      }

      function finishAnswer(isCorrect, q) {
          const card = document.getElementById("studyCard");
          if (isCorrect) {
              cqCorrectCount++;
              cqStreak++;
              playCardAnim(card, "medety-feedback-correct");
              spawnCheerText(cqCheerMessages[Math.floor(Math.random() * cqCheerMessages.length)]);
          } else {
              cqStreak = 0;
              cqWrongQueue.push(q);
              playCardAnim(card, "medety-feedback-wrong");
          }
          updateStreakBadge();

          const feedback = document.getElementById("feedbackArea");
          feedback.innerHTML = `<div class="coursequiz-feedback ${isCorrect ? "is-correct" : "is-wrong"}">`
                              + (isCorrect ? "✓ 正解！" : `✕ 不正解（正解: ${escapeHtml(correctAnswerText(q))}）`)
                              + `</div>`
                              + `<button type="button" class="btn btn-outline-primary rounded-pill w-100 mt-2" onclick="advanceQuestion()">つぎへ ➔</button>`;
      }

      function submitTagAnswer() {
          if (cqAnswered) return;
          cqAnswered = true;
          const q = cqQuestions[cqIndex];
          const selected = Array.from(document.querySelectorAll("#tagOptions .is-selected")).map(b => b.dataset.value);
          const correctSet = new Set(q.correctAnswers);
          const selectedSet = new Set(selected);
          const isCorrect = correctSet.size === selectedSet.size && [...correctSet].every(t => selectedSet.has(t));

          document.querySelectorAll("#tagOptions button").forEach(b => {
              b.disabled = true;
              const val = b.dataset.value;
              if (correctSet.has(val)) b.classList.add("is-correct");
              else if (b.classList.contains("is-selected")) b.classList.add("is-wrong");
          });
          document.getElementById("submitBtn").remove();
          finishAnswer(isCorrect, q);
      }

      function submitChoiceAnswer(index) {
          if (cqAnswered) return;
          cqAnswered = true;
          const q = cqQuestions[cqIndex];
          const chosen = q.options[index];
          const isCorrect = chosen === q.correctAnswer;

          document.querySelectorAll(".coursequiz-choice-btn").forEach((b, i) => {
              b.disabled = true;
              if (q.options[i] === q.correctAnswer) b.classList.add("is-correct");
              else if (i === index) b.classList.add("is-wrong");
          });
          finishAnswer(isCorrect, q);
      }

      function submitTypingAnswer() {
          if (cqAnswered) return;
          cqAnswered = true;
          const q = cqQuestions[cqIndex];
          const input = document.getElementById("typingInput");
          const val = (input.value || "").trim().toLowerCase();
          const isCorrect = val === (q.correctAnswer || "").trim().toLowerCase();
          input.disabled = true;
          input.classList.add(isCorrect ? "is-correct" : "is-wrong");
          finishAnswer(isCorrect, q);
      }

      function updateProgress() {
          const total = cqQuestions.length;
          const remaining = Math.max(0, total - cqIndex);
          document.getElementById("remainingCount").textContent = remaining;
          document.getElementById("studyProgress").style.width = `${(cqIndex / total) * 100}%`;
      }

      function advanceQuestion() {
          cqIndex++;

          if (cqIndex >= cqQuestions.length) {
              if (cqItemType === "lesson" && cqWrongQueue.length > 0 && !cqRetryAppended) {
                  cqRetryAppended = true;
                  cqQuestions = cqQuestions.concat(cqWrongQueue);
                  cqWrongQueue = [];
                  updateProgress();
                  renderQuestion();
                  return;
              }
              finishQuiz();
              return;
          }
          updateProgress();
          renderQuestion();
      }

      function finishQuiz() {
          const total = cqQuestions.length;
          const url = `studyresult.html?set=${encodeURIComponent(cqSetLabel)}&result=${cqCorrectCount}&total=${total}`
                    + `&way=course&group=${encodeURIComponent(cqGroup)}&unit=${cqUnit}&type=${cqItemType}&level=${encodeURIComponent(cqItemLevel)}`;
          location.href = url;
      }

      init();
    </script>
