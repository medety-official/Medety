    <script>
        const hour = new Date().getHours();
        document.getElementById("greeting").textContent =
            hour < 5  ? "こんばんは" :
            hour < 11 ? "おはようございます" :
            hour < 18 ? "こんにちは" : "おつかれさまです";

        const streak = medetyCalcStreak();
        const studiedToday = medetyStudiedToday();
        const totalWords = medetyTotalWords();

        let progressLine;
        if (streak >= 1 && studiedToday) {
            progressLine = `✅ 今日の分は学習ずみ！🔥 ${streak}日連続、いいペースです`;
        } else if (streak >= 1) {
            progressLine = `🔥 ${streak}日連続で学習中。今日の分もサクッと済ませよう`;
        } else if (totalWords > 0) {
            progressLine = `これまでに${totalWords}単語に挑戦しました。また少しずつ進めよう`;
        } else {
            progressLine = "実習で疲れた日も、1レッスンだけでOK。まずはコースを始めてみよう";
        }
        document.getElementById("progressLine").textContent = progressLine;

        // 「コースの続き」ボタンを、続きのレッスンにつなげる
        (async () => {
            const btn = document.getElementById("courseContinueBtn");
            try {
                const data = await loadMedetyData();
                if (!data || !data.words) throw new Error("no data");

                const lastGroup = medetyGetLastCourseGroup();
                const groupId = COURSE_GROUPS[lastGroup] ? lastGroup : COURSE_GROUP_ORDER[0];
                const group = COURSE_GROUPS[groupId];

                const plan = medetyApplyCourseLocks(medetyBuildCoursePlan(data.words, groupId), groupId)
                    .map((item, i) => Object.assign({}, item, { done: medetyIsCourseItemDone(groupId, item, i) }));
                if (plan.length === 0) throw new Error("no lessons");

                const nextIndex = plan.findIndex(it => !it.done);
                const isCourseDone = nextIndex === -1;
                const target = plan[isCourseDone ? plan.length - 1 : nextIndex];
                const targetIdx = isCourseDone ? plan.length - 1 : nextIndex;
                const lessonNumber = plan.slice(0, targetIdx + 1).filter(it => it.type === "lesson").length;
                const label = target.type === "test" ? "レベルアップテスト" : target.type === "review" ? "復習" : `レッスン${lessonNumber}`;
                const setLabel = `${group.label} ${label}`;

                document.getElementById("courseContinueEmoji").textContent = group.emoji;
                if (isCourseDone) {
                    document.getElementById("courseContinueTitle").textContent = `${group.label} コース修了！`;
                    document.getElementById("courseContinueSub").textContent = "お疲れさまでした。他の分野もやってみよう";
                    btn.onclick = () => { document.getElementById("courseGroupSelect").scrollIntoView({ behavior: "smooth", block: "start" }); };
                } else {
                    document.getElementById("courseContinueTitle").textContent = `${group.label}の続きへ`;
                    document.getElementById("courseContinueSub").textContent = setLabel;
                    btn.onclick = () => {
                        location.href = `coursequiz.html?group=${groupId}&unit=${nextIndex}&set=${encodeURIComponent(setLabel)}`;
                    };
                }
                btn.disabled = false;
            } catch (e) {
                console.error("コースの続きの読み込みに失敗:", e);
                document.getElementById("courseContinueTitle").textContent = "コース学習を始める";
                document.getElementById("courseContinueSub").textContent = "下から分野を選んでね";
                btn.disabled = false;
                btn.onclick = () => { document.getElementById("courseGroupSelect").scrollIntoView({ behavior: "smooth", block: "start" }); };
            }
        })();

        // コース学習の本体（分野を選んで、レッスンの道を表示する）
        let courseAllWords = [];

        window.addEventListener("load", async () => {
            const tabsEl = document.getElementById("courseGroupSelect");
            const container = document.getElementById("course-container");
            try {
                const allData = await loadMedetyData();
                if (!allData || !allData.words) return;
                courseAllWords = allData.words;

                const startGroup = medetyGetLastCourseGroup();
                const initialGroup = COURSE_GROUPS[startGroup] ? startGroup : COURSE_GROUP_ORDER[0];

                tabsEl.innerHTML = COURSE_GROUP_ORDER.map(gid => {
                    const g = COURSE_GROUPS[gid];
                    const selectedAttr = gid === initialGroup ? " selected" : "";
                    return `<option value="${gid}"${selectedAttr}>${g.emoji} ${g.label}</option>`;
                }).join("");

                renderCourseGroup(initialGroup);
            } catch (e) {
                console.error("コース学習の読み込みに失敗:", e);
                container.innerHTML = '<p class="text-center text-muted p-3">読み込みに失敗しました。</p>';
            }
        });

        const NODE_RING_R = 34;
        const NODE_RING_CIRC = 2 * Math.PI * NODE_RING_R;

        // ===== レッスンノードのプレビュー（ホバー／タップで開く吹き出し）の開閉制御 =====
        // PCでボタンまで斜めにカーソルを動かすと、ユニット以外の場所を一瞬通過して
        // mouseleaveが即座に発火し、押す前にポップオーバーが閉じてしまう問題への対策として、
        // 閉じるまでに少し猶予（グレースピリオド）を持たせる。
        const MEDETY_PREVIEW_HIDE_DELAY = 350;

        function medetyPreviewEnter(rowEl) {
            if (!rowEl || rowEl.classList.contains("medety-row-locked")) return;
            clearTimeout(rowEl._medetyHideTimer);
            rowEl.classList.add("show-preview");
        }
        function medetyPreviewLeave(rowEl) {
            if (!rowEl) return;
            clearTimeout(rowEl._medetyHideTimer);
            rowEl._medetyHideTimer = setTimeout(() => {
                rowEl.classList.remove("show-preview");
            }, MEDETY_PREVIEW_HIDE_DELAY);
        }
        function medetyPreviewToggleClick(rowEl, event) {
            if (!rowEl) return;
            clearTimeout(rowEl._medetyHideTimer);
            const willOpen = !rowEl.classList.contains("show-preview");
            document.querySelectorAll(".medety-lesson-row.show-preview").forEach(r => {
                if (r !== rowEl) {
                    clearTimeout(r._medetyHideTimer);
                    r.classList.remove("show-preview");
                }
            });
            rowEl.classList.toggle("show-preview", willOpen);
            if (event) event.stopPropagation();
        }
        // クリックでノード以外（ページの余白など）を押したら、開いているプレビューを閉じる
        document.addEventListener("click", () => {
            document.querySelectorAll(".medety-lesson-row.show-preview").forEach(r => {
                clearTimeout(r._medetyHideTimer);
                r.classList.remove("show-preview");
            });
        });

        // レッスン用：単語リストをプレビュー用の短いテキストにする
        function wordsPreviewText(wordsArr) {
            return wordsArr.map(w => w.word).join(" ・ ");
        }

        // 復習・テスト用：出題プールの説明文を作る（実際にどの単語が出るかは毎回ランダム）
        function poolPreviewText(item) {
            if (item.type === "review") {
                return `これまで学んだ${item.words.length}語からランダムに${COURSE_REVIEW_SIZE}問（英語タイピング）`;
            }
            return `このレベルの${item.words.length}語からランダムに${COURSE_TEST_SIZE}問（英語タイピング・合格ライン${Math.round(COURSE_TEST_PASS_RATE * 100)}%）`;
        }

        // 1つの項目（レッスン／復習／テスト）を開始するリンク先を作る
        // レッスンだけは、出題前に単語一覧をプレビューできる画面を経由する
        function courseItemHref(groupId, planIndex, groupLabel, item, lessonNumber) {
            const label = item.type === "test" ? "レベルアップテスト" : item.type === "review" ? "復習" : `レッスン${lessonNumber}`;
            const setLabel = `${groupLabel} ${label}`;
            const query = `group=${groupId}&unit=${planIndex}&set=${encodeURIComponent(setLabel)}`;
            if (item.type === "lesson") {
                return `courselesson.html?${query}`;
            }
            return `coursequiz.html?${query}`;
        }

        const courseSelectedLevel = {}; // groupId -> 現在表示中のレベル（切り替えるとここに記憶される）

        function renderCourseGroup(groupId, forceLevel) {
            const groupSelect = document.getElementById("courseGroupSelect");
            if (groupSelect.value !== groupId) groupSelect.value = groupId;

            const container = document.getElementById("course-container");
            const group = COURSE_GROUPS[groupId];
            const rawPlan = medetyBuildCoursePlan(courseAllWords, groupId);

            if (rawPlan.length === 0) {
                container.innerHTML = '<p class="text-center text-muted p-3">この分野の単語はまだ登録されていません。</p>';
                return;
            }

            const plan = medetyApplyCourseLocks(rawPlan, groupId).map((item, i) => Object.assign({}, item, {
                planIndex: i,
                done: medetyIsCourseItemDone(groupId, item, i),
            }));

            const nextIndex = plan.findIndex(it => !it.done);

            // このグループに実際に登場するレベルの一覧（順番通り）
            const levelsInGroup = [];
            plan.forEach(it => { if (!levelsInGroup.includes(it.level)) levelsInGroup.push(it.level); });

            // 今まさに取り組んでいるレベルをデフォルトで表示する（全部終わっていれば最後のレベル）
            const currentLevel = nextIndex === -1 ? plan[plan.length - 1].level : plan[nextIndex].level;
            let selectedLevel = forceLevel || courseSelectedLevel[groupId] || currentLevel;
            if (!levelsInGroup.includes(selectedLevel)) selectedLevel = currentLevel;
            courseSelectedLevel[groupId] = selectedLevel;

            // レベル切り替えプルダウン（区切りが分かりにくい問題への対策：1レベルずつ表示し、いつでも前のレベルに戻れる）
            const levelOptionsHtml = levelsInGroup.map(lv => {
                const levelItems = plan.filter(it => it.level === lv);
                const levelAllDone = levelItems.every(it => it.done);
                const levelLocked = levelItems[0].locked;
                const mark = levelLocked ? "🔒 " : levelAllDone ? "✓ " : "";
                const selectedAttr = lv === selectedLevel ? " selected" : "";
                return `<option value="${lv}"${selectedAttr}>${mark}${COURSE_LEVEL_LABELS[lv] || lv}</option>`;
            }).join("");
            document.getElementById("courseLevelSelect").innerHTML = levelOptionsHtml;

            // 選択中のレベルの項目だけに絞り込む
            const levelPlan = plan.filter(it => it.level === selectedLevel);

            // レッスン番号（復習・テストを除いた通し番号、グループ全体で通し）を先に振っておく
            let lessonCounter = 0;
            const lessonNumbers = plan.map(it => it.type === "lesson" ? ++lessonCounter : null);

            // 連続する「lesson」をチェックポイント（1つの円）にまとめ、review/testは単独ノードにする
            const visualNodes = [];
            let buffer = [];
            const flushBuffer = () => {
                if (buffer.length > 0) {
                    visualNodes.push({ kind: "checkpoint", items: buffer });
                    buffer = [];
                }
            };
            levelPlan.forEach(item => {
                if (item.type === "lesson") {
                    buffer.push(item);
                    if (buffer.length >= COURSE_NODE_SIZE) flushBuffer();
                } else {
                    flushBuffer();
                    visualNodes.push({ kind: item.type, items: [item] });
                }
            });
            flushBuffer();

            let nodesHtml = "";
            visualNodes.forEach((node, idx) => {
                const side = idx % 2 === 0 ? "start" : "end";
                const containsNext = node.items.some(it => it.planIndex === nextIndex);
                const isLocked = node.items[0].locked;
                const target = node.items.find(it => !it.done) || node.items[0];
                const targetLabel = target.type === "test" ? "レベルアップテスト" : target.type === "review" ? "復習" : `レッスン${lessonNumbers[target.planIndex]}`;
                const href = courseItemHref(groupId, target.planIndex, group.label, target, lessonNumbers[target.planIndex]);

                let nodeInnerHtml, extraClass = "";
                const previewWords = target.type === "lesson" ? wordsPreviewText(target.words) : poolPreviewText(target);

                let checkpointRedoBody = "";
                let checkpointAllDone = false;
                if (node.kind === "checkpoint") {
                    const doneInNode = node.items.filter(it => it.done).length;
                    const frac = doneInNode / node.items.length;
                    const allDone = doneInNode === node.items.length;
                    checkpointAllDone = allDone;
                    if (allDone) extraClass = " medety-lesson-done";
                    if (isLocked) extraClass += " medety-lesson-locked";

                    // 分数表示の代わりに、終わったレッスンのぶんだけ丸が増えるドット表示にする
                    const dotsHtml = `<div class="medety-node-dots">${node.items.map(it =>
                        `<span class="medety-node-dot${it.done ? " is-filled" : ""}"></span>`
                    ).join("")}</div>`;
                    const centerContent = isLocked ? "🔒" : allDone ? "✓" : dotsHtml;

                    nodeInnerHtml = `
                        <svg class="medety-node-ring" viewBox="0 0 80 80" width="72" height="72">
                            <circle class="medety-node-ring-track" cx="40" cy="40" r="${NODE_RING_R}"></circle>
                            <circle class="medety-node-ring-progress" cx="40" cy="40" r="${NODE_RING_R}"
                                    style="stroke-dasharray:${NODE_RING_CIRC}; stroke-dashoffset:${NODE_RING_CIRC * (1 - frac)};"></circle>
                        </svg>
                        <div class="medety-lesson-node${extraClass}">${centerContent}</div>`;

                    // 完了済みのレッスンは、チェックポイントがまだ途中でも個別にやり直せるようにする
                    const doneItems = node.items.filter(it => it.done);
                    if (!isLocked && doneItems.length > 0) {
                        checkpointRedoBody = `
                            <div class="small text-muted mt-2 mb-1">${allDone ? "もう一度挑戦する" : "やり直す"}</div>
                            <div class="d-flex flex-wrap gap-1 justify-content-center">
                                ${doneItems.map(it => {
                                    const redoHref = courseItemHref(groupId, it.planIndex, group.label, it, lessonNumbers[it.planIndex]);
                                    return `<button type="button" class="btn btn-outline-secondary btn-sm rounded-pill px-2"
                                                     onclick="event.stopPropagation(); location.href='${redoHref}'">レッスン${lessonNumbers[it.planIndex]}</button>`;
                                }).join("")}
                            </div>`;
                    }
                } else if (node.kind === "review") {
                    if (target.done) extraClass = " medety-lesson-done";
                    if (isLocked) extraClass += " medety-lesson-locked";
                    nodeInnerHtml = `<div class="medety-lesson-node medety-lesson-review${extraClass}">${isLocked ? "🔒" : target.done ? "✓" : "🔄"}</div>`;
                } else { // test
                    if (target.done) extraClass = " medety-lesson-done";
                    if (isLocked) extraClass += " medety-lesson-locked";
                    nodeInnerHtml = `<div class="medety-lesson-node medety-lesson-test${extraClass}">${isLocked ? "🔒" : target.done ? "✓" : "🏆"}</div>`;
                }

                const previewBody = isLocked
                    ? `<div class="medety-node-preview-words">🔒 手前のレベルアップテストに合格すると解放されます</div>`
                    : (node.kind === "checkpoint" && checkpointAllDone)
                        ? checkpointRedoBody
                        : `<div class="medety-node-preview-title">${targetLabel}</div>
                           <div class="medety-node-preview-words">${previewWords}</div>
                           <button type="button" class="btn btn-primary btn-sm rounded-pill mt-2 px-3"
                                   onclick="event.stopPropagation(); location.href='${href}'">始める ➔</button>
                           ${checkpointRedoBody}`;

                nodesHtml += `
                    <div class="medety-lesson-row medety-side-${side}${isLocked ? " medety-row-locked" : ""}"
                         onmouseenter="medetyPreviewEnter(this)"
                         onmouseleave="medetyPreviewLeave(this)"
                         onclick="medetyPreviewToggleClick(this, event)">
                        <div class="medety-node-line">
                            ${containsNext && !isLocked ? '<span class="medety-lesson-start-tag">START</span>' : ""}
                            <div class="medety-node-wrap${isLocked ? " medety-node-locked" : ""}">
                                ${nodeInnerHtml}
                            </div>
                        </div>
                        <div class="medety-node-preview" onmouseenter="medetyPreviewEnter(this.closest('.medety-lesson-row'))" onmouseleave="medetyPreviewLeave(this.closest('.medety-lesson-row'))">${previewBody}</div>
                    </div>`;
            });

            container.innerHTML = `<div class="medety-lesson-path">${nodesHtml}</div>`;
        }
    </script>

    <script src="bootstrap.bundle.min.js"></script>
    <script src="sidebars.js"></script>
  </body>
</html>
