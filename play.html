    <script>
      // ===== 設定の読み込み =====
      const playParams = new URLSearchParams(window.location.search);
      const playGroup = playParams.get("group") || "all";
      const playLevel = playParams.get("level") || "all";
      const playDifficultyKey = playParams.get("difficulty") || "normal";
      function difficultyPoints(base, mult) { return Math.max(1, Math.round(base * mult)); }
      const DIFFICULTY_PRESETS = {
          easy:     { label: "かんたん",   scrollSpeed: 2.2, obstacleInterval: 220, obstacleGap: 260, coinRandomness: 0,    scoreMultiplier: 1,
                      quizBannerStart: 110, quizBannerMin: 110, quizBannerStep: 0 },
          normal:   { label: "ふつう",     scrollSpeed: 3,   obstacleInterval: 170, obstacleGap: 230, coinRandomness: 0,    scoreMultiplier: 1.5,
                      quizBannerStart: 110, quizBannerMin: 110, quizBannerStep: 0 },
          hard:     { label: "むずかしい", scrollSpeed: 3.8, obstacleInterval: 130, obstacleGap: 195, coinRandomness: 0.5,  scoreMultiplier: 2,
                      quizBannerStart: 110, quizBannerMin: 110, quizBannerStep: 0 },
          veryhard: { label: "激ムズ",     scrollSpeed: 4.6, obstacleInterval: 100, obstacleGap: 170, coinRandomness: 1,    scoreMultiplier: 3,
                      quizBannerStart: 110, quizBannerMin: 40, quizBannerStep: 10 }, // 出題のたびにバナー時間が短くなり、40フレーム（約0.7秒）で下げ止まる
      };
      const DIFF = DIFFICULTY_PRESETS[playDifficultyKey] || DIFFICULTY_PRESETS.normal;
      const scrollSpeed = DIFF.scrollSpeed;
      const QUIZ_POINTS = difficultyPoints(10, DIFF.scoreMultiplier);
      const BONUS_POINTS = difficultyPoints(1, DIFF.scoreMultiplier);

      // ===== テーマカラーを取得（キャンバスはCSS変数を直接使えないため） =====
      function cssVar(name, fallback) {
          const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
          return v || fallback;
      }
      const COLORS = {
          bg: cssVar("--c-bg", "#fcfaf2"),
          sky: cssVar("--c-surface", "#ffffff"),
          text: cssVar("--c-text", "#4a4543"),
          primary: cssVar("--c-primary", "#8db57a"),
          primaryDark: cssVar("--c-primary-dark", "#7da36a"),
          accent: cssVar("--c-accent", "#f2c091"),
          quick: cssVar("--c-quick", "#f0a1a8"),
          warm: cssVar("--c-warm", "#8a6b63"),
          border: cssVar("--c-border", "#e2e4db"),
          surface: cssVar("--c-surface", "#ffffff"),
      };

      // ===== 音（Web Audio APIで簡易生成。追加ファイル不要） =====
      let audioCtx = null;
      function ensureAudio() {
          if (!audioCtx) {
              try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
          } else if (audioCtx.state === "suspended") {
              audioCtx.resume();
          }
      }
      function playTone(freq, duration, type, vol) {
          if (!audioCtx) return;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type || "sine";
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(vol || 0.16, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
      }
      function sfxJump() { playTone(540, 0.09, "square", 0.12); }
      function sfxBonus() { playTone(900, 0.1, "triangle", 0.14); }
      function sfxCorrect() { playTone(880, 0.12, "triangle", 0.16); setTimeout(() => playTone(1320, 0.14, "triangle", 0.16), 80); }
      function sfxWrong() { playTone(180, 0.28, "sawtooth", 0.15); }
      function sfxHit() { playTone(120, 0.3, "sawtooth", 0.15); }
      function sfxNewBest() {
          playTone(660, 0.12, "triangle", 0.18);
          setTimeout(() => playTone(880, 0.12, "triangle", 0.18), 100);
          setTimeout(() => playTone(1100, 0.2, "triangle", 0.2), 200);
      }
      function sfxHeart() {
          playTone(520, 0.1, "sine", 0.16);
          setTimeout(() => playTone(780, 0.16, "sine", 0.18), 90);
      }

      // ===== キャンバス・定数 =====
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const CANVAS_W = canvas.width;
      const CANVAS_H = canvas.height;
      const GROUND_Y = CANVAS_H - 36;
      const GRAVITY = 0.45;
      const JUMP_V = -7.6;
      const BIRD_X = 66;
      const BIRD_R = 15;

      const OBSTACLE_INTERVAL = DIFF.obstacleInterval; // フレーム間隔（大きいほど出現頻度が下がる）
      const OBSTACLE_GAP = DIFF.obstacleGap; // 通過できる幅（大きいほど簡単）
      const OBSTACLE_MARGIN = 30; // 天井・地面からの最低余白
      const OBSTACLE_W = 46;
      const BONUS_INTERVAL = 260;
      const QUIZ_INTERVAL = 480; // 約8秒（60fps換算）
      const BEST_SCORE_KEY = "medetyPlayBestScore";

      // ===== 選択肢コインの配置パターン（上から必ずA→B→C→Dの順。横方向だけ変化） =====
      const QUIZ_LAYOUTS = [
          // 縦一列（まっすぐ）
          () => {
              const top = 90, bottom = GROUND_Y - 90;
              const slot = (bottom - top) / 4;
              return [0, 1, 2, 3].map(i => ({ dx: 0, y: top + slot * i + slot / 2 }));
          },
          // 右下がり階段
          () => {
              const top = 90, bottom = GROUND_Y - 90;
              const slot = (bottom - top) / 4;
              return [0, 1, 2, 3].map(i => ({ dx: i * 50, y: top + slot * i + slot / 2 }));
          },
          // 右上がり階段
          () => {
              const top = 90, bottom = GROUND_Y - 90;
              const slot = (bottom - top) / 4;
              return [0, 1, 2, 3].map(i => ({ dx: (3 - i) * 50, y: top + slot * i + slot / 2 }));
          },
          // ジグザグ
          () => {
              const top = 90, bottom = GROUND_Y - 90;
              const slot = (bottom - top) / 4;
              return [0, 1, 2, 3].map(i => ({ dx: (i % 2 === 0 ? 0 : 70), y: top + slot * i + slot / 2 }));
          },
      ];
      function pickQuizLayout() {
          if (Math.random() >= DIFF.coinRandomness) return QUIZ_LAYOUTS[0]();
          return QUIZ_LAYOUTS[Math.floor(Math.random() * QUIZ_LAYOUTS.length)]();
      }

      // ===== ボーナスコインの配置パターン（バリエーション用） =====
      const BONUS_PATTERNS = [
          (baseY) => [0, 1, 2, 3, 4].map(i => ({ dx: i * 34, y: baseY })), // 一直線
          (baseY) => [0, 1, 2, 3, 4].map(i => ({ dx: i * 34, y: baseY - i * 20 })), // 上昇
          (baseY) => [0, 1, 2, 3, 4].map(i => ({ dx: i * 34, y: baseY + i * 20 })), // 下降
          (baseY) => [0, 1, 2, 3, 4].map(i => ({ dx: i * 34, y: baseY - Math.abs(i - 2) * 26 })), // 山型
          (baseY) => [0, 1, 2, 3, 4].map(i => ({ dx: i * 34, y: baseY + Math.abs(i - 2) * 26 })), // 谷型
          (baseY) => [0, 1, 2, 3, 4].map(i => ({ dx: i * 34, y: baseY + (i % 2 === 0 ? -22 : 22) })), // ジグザグ
      ];

      // ===== 自己ベスト =====
      function getBestScore() {
          try { return parseInt(localStorage.getItem(BEST_SCORE_KEY) || "0", 10) || 0; } catch (e) { return 0; }
      }
      function setBestScore(v) {
          try { localStorage.setItem(BEST_SCORE_KEY, String(v)); } catch (e) {}
      }

      // ===== ゲーム状態 =====
      let bird, obstacles, bonusCoins, quizCoins, heartPickup;
      let score, lives, frame, running, started, invulnFrames;
      let bgScrollX = 0; // 背景（雲・町並み）のスクロール位置。障害物と同じ速さで進める
      let nextObstacleFrame, nextBonusFrame, nextQuizFrame;
      let quizPhase, quizBannerTimer, currentQuestion, quizOccurrenceCount;
      let heartQuestionCounter = 0; // ハートを失ってからの経過問題数（満タン時は増えない）
      let quizHistory = [];
      let questionPool = [];
      let allWordsForFallback = [];
      let lastQuestionWord = null;

      function resetState() {
          bird = { y: CANVAS_H / 2, vy: 0 };
          obstacles = [];
          bonusCoins = [];
          quizCoins = [];
          heartPickup = null;
          heartQuestionCounter = 0;
          score = 0;
          lives = 3;
          frame = 0;
          invulnFrames = 0;
          bgScrollX = 0;
          running = false;
          started = false;
          nextObstacleFrame = 60;
          nextBonusFrame = 200;
          nextQuizFrame = QUIZ_INTERVAL;
          quizPhase = null;
          quizBannerTimer = 0;
          quizOccurrenceCount = 0;
          quizHistory = [];
          currentQuestion = null;
          document.getElementById("questionBanner").style.display = "none";
          document.getElementById("gameOverOverlay").style.display = "none";
          document.getElementById("startOverlay").style.display = "flex";
          document.getElementById("startDifficultyLabel").textContent = `難易度：${DIFF.label}（スコア×${DIFF.scoreMultiplier}）`;
      }

      // ===== データの単語/意味フィールド入れ違いの補正 =====
      // データ中に一部、word（英語であるべき）とmeaning（日本語であるべき）が
      // 入れ違っている行があるため、出題前に検出して直す。
      const JP_CHAR_RE = /[぀-ヿ一-鿿]/;
      function medetyLooksJapanese(text) { return JP_CHAR_RE.test(text || ""); }
      function medetyNormalizeWordEntry(w) {
          if (medetyLooksJapanese(w.word) && w.meaning && !medetyLooksJapanese(w.meaning)) {
              return Object.assign({}, w, { word: w.meaning, meaning: w.word });
          }
          return w;
      }
      function medetyIsPlayableWord(w) {
          return !!(w && w.word && w.word.trim() && w.meaning && w.meaning.trim() && !medetyLooksJapanese(w.word));
      }

      // ===== データ読み込み・出題プール作成 =====
      async function init() {
          resetState();
          try {
              const data = await loadMedetyData();
              if (!data || !data.words) throw new Error("no data");
              const normalizedWords = data.words.map(medetyNormalizeWordEntry).filter(medetyIsPlayableWord);
              allWordsForFallback = normalizedWords;

              let pool = normalizedWords;
              if (playGroup !== "all" && COURSE_GROUPS[playGroup]) {
                  const fieldSet = new Set(COURSE_GROUPS[playGroup].fields);
                  pool = pool.filter(w => fieldSet.has((w.field || "").toString().trim()));
              }
              if (playLevel !== "all") {
                  pool = pool.filter(w => medetyWordLevelKey(w) === playLevel);
              }
              questionPool = pool.length > 0 ? pool : normalizedWords;

              document.getElementById("loadingOverlay").style.display = "none";
              requestAnimationFrame(loop);
          } catch (e) {
              console.error("プレイモードの読み込みに失敗:", e);
              document.getElementById("loadingOverlay").innerHTML = '<div class="small">読み込みに失敗しました。<a href="playsetting.html" class="text-white">設定に戻る</a></div>';
          }
      }

      function pickQuestion() {
          const candidates = questionPool.filter(w => w !== lastQuestionWord && w.word && w.meaning);
          const source = candidates.length > 0 ? candidates : questionPool;
          const word = source[Math.floor(Math.random() * source.length)];
          lastQuestionWord = word;
          const optionPool = questionPool.length >= 4 ? questionPool : allWordsForFallback;
          const options = medetyBuildChoiceOptions(word, optionPool, "word", 4);
          return { word, prompt: word.meaning, options, correctIndex: options.indexOf(word.word) };
      }

      // ===== 入力 =====
      function jump() {
          ensureAudio();
          if (!started) {
              started = true;
              running = true;
              document.getElementById("startOverlay").style.display = "none";
          }
          if (!running) return;
          bird.vy = JUMP_V;
          sfxJump();
      }

      canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); jump(); });
      document.getElementById("playWrap").addEventListener("pointerdown", (e) => {
          if (e.target === canvas) return; // canvasは上のリスナーで処理済み
      });
      window.addEventListener("keydown", (e) => {
          if (e.code === "Space") { e.preventDefault(); jump(); }
      });

      function restartGame() {
          resetState();
          document.getElementById("startOverlay").style.display = "flex";
      }

      // ===== 衝突判定 =====
      function circleRectHit(cx, cy, r, rx, ry, rw, rh) {
          const nearestX = Math.max(rx, Math.min(cx, rx + rw));
          const nearestY = Math.max(ry, Math.min(cy, ry + rh));
          const dx = cx - nearestX;
          const dy = cy - nearestY;
          return (dx * dx + dy * dy) < (r * r);
      }
      function circleHit(x1, y1, r1, x2, y2, r2) {
          const dx = x1 - x2, dy = y1 - y2;
          return (dx * dx + dy * dy) < (r1 + r2) * (r1 + r2);
      }

      function loseLife() {
          if (invulnFrames > 0) return;
          lives--;
          invulnFrames = 80;
          heartQuestionCounter = 0; // 失った瞬間から、また10問カウントし直す
          sfxHit();
          if (lives <= 0) endGame();
      }

      // ===== 回復ハート（ハートが満タンでない時、10問ごとに出現） =====
      function spawnHeartPickup() {
          heartPickup = {
              x: CANVAS_W + 40,
              baseY: 110 + Math.random() * Math.max(GROUND_Y - 220, 0),
              phase: 0,
              y: 0,
              r: 13,
          };
          heartPickup.y = heartPickup.baseY;
      }

      function endGame() {
          running = false;
          const best = getBestScore();
          const isNewBest = score > best;
          if (isNewBest) setBestScore(score);
          document.getElementById("finalScore").textContent = score;
          const bestEl = document.getElementById("bestScoreLine");
          bestEl.classList.toggle("is-new-best", isNewBest);
          if (isNewBest) {
              bestEl.textContent = `🎉 自己ベスト更新！ ${score}点`;
              sfxNewBest();
          } else {
              bestEl.textContent = `自己ベスト：${best}点`;
          }
          try {
              localStorage.setItem("medetyPlayLastResult", JSON.stringify({
                  score,
                  difficultyKey: playDifficultyKey,
                  difficultyLabel: DIFF.label,
                  group: playGroup,
                  level: playLevel,
                  quizHistory,
                  savedAt: Date.now(),
              }));
          } catch (e) {}
          document.getElementById("gameOverOverlay").style.display = "flex";
      }

      // ===== 更新 =====
      // dt: 前回の描画からの経過時間を「60fpsなら1」になるよう正規化した倍率。
      // これを掛けずに固定量ずつ動かしていると、タブが背景に回るなどしてrequestAnimationFrameの
      // 呼び出し頻度が落ちたとき、見た目の速度がそのまま遅くなってしまう（今回の不具合の原因）。
      function update(dt) {
          frame += dt;
          bgScrollX += scrollSpeed * dt; // 背景も障害物と同じ速さでスクロールさせる
          if (invulnFrames > 0) invulnFrames = Math.max(0, invulnFrames - dt);

          bird.vy += GRAVITY * dt;
          bird.y += bird.vy * dt;
          if (bird.y > GROUND_Y - BIRD_R) {
              bird.y = GROUND_Y - BIRD_R;
              bird.vy = 0;
              loseLife();
          }
          if (bird.y < BIRD_R) {
              bird.y = BIRD_R;
              bird.vy = 0;
          }

          // 障害物（クイズ中は出現を止めて、コインと重ならないようにする）
          if (quizPhase === null && frame >= nextObstacleFrame) {
              const gapRange = GROUND_Y - OBSTACLE_MARGIN * 2 - OBSTACLE_GAP;
              const obstacleX = CANVAS_W + 20;
              let gapCenter = OBSTACLE_MARGIN + OBSTACLE_GAP / 2 + Math.random() * Math.max(gapRange, 0);
              // すでに出ているボーナスコインとx方向が重なる場合は、そのコインが通路（隙間）に
              // 収まるよう隙間の中心を寄せる（ボーナスコインは通路の中にあるぶんには構わない）
              const overlappingCoins = bonusCoins.filter(c => c.x + c.r > obstacleX && c.x - c.r < obstacleX + OBSTACLE_W);
              if (overlappingCoins.length > 0) {
                  const avgY = overlappingCoins.reduce((sum, c) => sum + c.y, 0) / overlappingCoins.length;
                  const minCenter = OBSTACLE_MARGIN + OBSTACLE_GAP / 2;
                  const maxCenter = GROUND_Y - OBSTACLE_MARGIN - OBSTACLE_GAP / 2;
                  gapCenter = Math.max(minCenter, Math.min(maxCenter, avgY));
              }
              obstacles.push({ x: obstacleX, gapCenter, passed: false });
              nextObstacleFrame = frame + OBSTACLE_INTERVAL;
          }
          obstacles.forEach(o => { o.x -= scrollSpeed * dt; });
          obstacles = obstacles.filter(o => o.x > -OBSTACLE_W - 10);
          obstacles.forEach(o => {
              const topH = o.gapCenter - OBSTACLE_GAP / 2;
              const botY = o.gapCenter + OBSTACLE_GAP / 2;
              if (circleRectHit(BIRD_X, bird.y, BIRD_R, o.x, 0, OBSTACLE_W, topH) ||
                  circleRectHit(BIRD_X, bird.y, BIRD_R, o.x, botY, OBSTACLE_W, GROUND_Y - botY)) {
                  loseLife();
              }
          });

          // ボーナスコイン（クイズ中は出現を止める。配置パターンはランダム）
          if (quizPhase === null && frame >= nextBonusFrame) {
              const baseY = 160 + Math.random() * Math.max(GROUND_Y - 320, 0);
              const pattern = BONUS_PATTERNS[Math.floor(Math.random() * BONUS_PATTERNS.length)](baseY);
              pattern.forEach(slot => {
                  let y = Math.max(50, Math.min(GROUND_Y - 50, slot.y));
                  const x = CANVAS_W + 40 + slot.dx;
                  const r = 9;
                  // 障害物の壁とは重ならないようにする（通路＝隙間の中にあるのは問題ない）
                  obstacles.forEach(o => {
                      if (x + r < o.x || x - r > o.x + OBSTACLE_W) return; // x方向に重ならないなら無関係
                      const top = o.gapCenter - OBSTACLE_GAP / 2;
                      const bot = o.gapCenter + OBSTACLE_GAP / 2;
                      const margin = r + 4;
                      if (y < top + margin || y > bot - margin) {
                          y = Math.max(top + margin, Math.min(bot - margin, o.gapCenter));
                      }
                  });
                  bonusCoins.push({ x, y, r });
              });
              nextBonusFrame = frame + BONUS_INTERVAL;
          }
          bonusCoins.forEach(c => { c.x -= scrollSpeed * dt; });
          bonusCoins = bonusCoins.filter(c => {
              if (c.x < -20) return false;
              if (circleHit(BIRD_X, bird.y, BIRD_R, c.x, c.y, c.r)) {
                  score += BONUS_POINTS;
                  sfxBonus();
                  return false;
              }
              return true;
          });

          // クイズ
          if (quizPhase === null && frame >= nextQuizFrame && questionPool.length > 0) {
              currentQuestion = pickQuestion();
              quizPhase = "banner";
              quizBannerTimer = Math.max(
                  DIFF.quizBannerMin,
                  DIFF.quizBannerStart - quizOccurrenceCount * DIFF.quizBannerStep
              );
              quizOccurrenceCount++;
              showQuestionBanner(currentQuestion);
          } else if (quizPhase === "banner") {
              quizBannerTimer -= dt;
              // 障害物の新規出現はクイズ中ずっと止めてあるので、画面上の障害物が
              // 自然にスクロールして消えるまで待ってからコインを出す
              // （途中で強制的に消すと、見えている障害物が突然消えたように見えてしまうため）
              if (quizBannerTimer <= 0 && obstacles.length === 0) {
                  quizPhase = "coins";
                  const layout = pickQuizLayout();
                  quizCoins = layout.map((slot, i) => ({
                      x: CANVAS_W + 60 + slot.dx,
                      y: slot.y,
                      r: 15,
                      label: "ABCD"[i],
                      correct: i === currentQuestion.correctIndex,
                  }));
              }
          } else if (quizPhase === "coins") {
              quizCoins.forEach(c => { c.x -= scrollSpeed * dt; });
              let resolved = false;
              let wasCorrect = false;
              quizCoins.forEach(c => {
                  if (!resolved && circleHit(BIRD_X, bird.y, BIRD_R, c.x, c.y, c.r)) {
                      resolved = true;
                      wasCorrect = c.correct;
                      if (c.correct) { score += QUIZ_POINTS; sfxCorrect(); }
                      else { sfxWrong(); loseLife(); }
                  }
              });
              if (resolved || quizCoins.every(c => c.x < -30)) {
                  quizHistory.push({
                      prompt: currentQuestion.prompt,
                      correctAnswer: currentQuestion.options[currentQuestion.correctIndex],
                      options: currentQuestion.options.slice(),
                      outcome: resolved ? (wasCorrect ? "correct" : "wrong") : "skipped",
                  });
                  quizCoins = [];
                  quizPhase = null;
                  hideQuestionBanner();
                  nextQuizFrame = frame + QUIZ_INTERVAL;
                  nextObstacleFrame = frame + OBSTACLE_INTERVAL;

                  // ハートが満タンでないときだけ経過問題数を数え、10問ごとに回復ハートを出す
                  if (lives < 3) {
                      heartQuestionCounter++;
                      if (heartQuestionCounter % 10 === 0 && !heartPickup) {
                          spawnHeartPickup();
                      }
                  }
              }
          }

          // 回復ハート（ふわふわ上下に動きながら流れてくる。取ると満タンでなければ1回復）
          if (heartPickup) {
              heartPickup.phase += 0.07 * dt;
              heartPickup.x -= scrollSpeed * dt;
              heartPickup.y = heartPickup.baseY + Math.sin(heartPickup.phase) * 36;
              if (heartPickup.x < -30) {
                  heartPickup = null;
              } else if (circleHit(BIRD_X, bird.y, BIRD_R, heartPickup.x, heartPickup.y, heartPickup.r)) {
                  if (lives < 3) {
                      lives++;
                      sfxHeart();
                  }
                  heartPickup = null;
              }
          }
      }

      function showQuestionBanner(q) {
          const labels = ["A", "B", "C", "D"];
          document.getElementById("qPromptText").textContent = `${q.prompt}`;
          document.getElementById("qOptionsText").innerHTML = q.options.map((opt, i) =>
              `<span class="q-opt">${labels[i]}: ${opt}</span>`
          ).join("");
          document.getElementById("questionBanner").style.display = "block";
      }
      function hideQuestionBanner() {
          document.getElementById("questionBanner").style.display = "none";
      }

      // ===== 描画 =====
      // ===== 背景（空・雲） =====
      // タイル幅ぶんの模様を繰り返し並べて、障害物と同じ速さ（bgScrollX）でスクロールさせる。
      const BG_TILE_W = CANVAS_W;
      const CLOUD_SHAPES = [
          { x: 55, y: 75, scale: 1.0 },
          { x: 150, y: 130, scale: 0.6 },
          { x: 250, y: 55, scale: 0.85 },
          { x: 330, y: 115, scale: 0.7 },
      ];
      function drawCloud(x, y, scale) {
          ctx.beginPath();
          ctx.arc(x, y, 14 * scale, 0, Math.PI * 2);
          ctx.arc(x + 16 * scale, y - 6 * scale, 12 * scale, 0, Math.PI * 2);
          ctx.arc(x + 30 * scale, y, 15 * scale, 0, Math.PI * 2);
          ctx.arc(x + 14 * scale, y + 7 * scale, 13 * scale, 0, Math.PI * 2);
          ctx.fill();
      }

      function drawBackground() {
          // 空（グラデーション）
          const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
          skyGrad.addColorStop(0, COLORS.sky);
          skyGrad.addColorStop(1, COLORS.bg);
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

          const offset = ((bgScrollX % BG_TILE_W) + BG_TILE_W) % BG_TILE_W;

          // 雲（空と同化しすぎないよう、淡いグレーで）
          ctx.globalAlpha = 0.8;
          ctx.fillStyle = COLORS.border;
          for (let t = -1; t <= 1; t++) {
              const tileX = t * BG_TILE_W - offset;
              CLOUD_SHAPES.forEach(c => drawCloud(tileX + c.x, c.y, c.scale));
          }
          ctx.globalAlpha = 1;
      }

      function render() {
          drawBackground();

          // 地面
          ctx.fillStyle = COLORS.border;
          ctx.fillRect(0, GROUND_Y, CANVAS_W, CANVAS_H - GROUND_Y);
          ctx.fillStyle = COLORS.primaryDark;
          ctx.fillRect(0, GROUND_Y, CANVAS_W, 4);

          // 障害物
          ctx.fillStyle = COLORS.warm;
          obstacles.forEach(o => {
              const topH = o.gapCenter - OBSTACLE_GAP / 2;
              const botY = o.gapCenter + OBSTACLE_GAP / 2;
              roundRect(o.x, 0, OBSTACLE_W, Math.max(topH, 0), 8);
              roundRect(o.x, botY, OBSTACLE_W, GROUND_Y - botY, 8);
          });

          // ボーナスコイン
          bonusCoins.forEach(c => {
              ctx.beginPath();
              ctx.fillStyle = COLORS.primary;
              ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
              ctx.fill();
          });

          // 回復ハート（ふわふわ動いて目立つように、拍動させる）
          if (heartPickup) {
              const pulse = 1 + Math.sin(heartPickup.phase * 2) * 0.18;
              ctx.save();
              ctx.translate(heartPickup.x, heartPickup.y);
              ctx.scale(pulse, pulse);
              ctx.font = "26px sans-serif";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText("❤️", 0, 0);
              ctx.restore();
          }

          // クイズコイン
          quizCoins.forEach(c => {
              ctx.beginPath();
              ctx.fillStyle = COLORS.surface;
              ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
              ctx.fill();
              ctx.lineWidth = 3;
              ctx.strokeStyle = COLORS.accent;
              ctx.stroke();
              ctx.fillStyle = COLORS.text;
              ctx.font = "bold 15px sans-serif";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(c.label, c.x, c.y + 1);
          });

          // 鳥（無敵中は点滅させる）
          if (invulnFrames <= 0 || frame % 8 < 4) {
              ctx.save();
              ctx.translate(BIRD_X, bird.y);
              ctx.rotate(Math.max(-0.5, Math.min(0.9, bird.vy * 0.06)));
              ctx.font = "28px sans-serif";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText("🐥", 0, 0);
              ctx.restore();
          }

          // HUD
          ctx.textAlign = "left";
          ctx.textBaseline = "top";
          ctx.font = "bold 18px sans-serif";
          ctx.fillStyle = COLORS.text;
          ctx.fillText(`スコア ${score}`, 10, 10);

          ctx.textAlign = "right";
          ctx.font = "18px sans-serif";
          ctx.fillText("❤️".repeat(Math.max(0, lives)) + "🖤".repeat(Math.max(0, 3 - lives)), CANVAS_W - 10, 10);
      }

      function roundRect(x, y, w, h, r) {
          if (h <= 0) return;
          const rr = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + rr, y);
          ctx.arcTo(x + w, y, x + w, y + h, rr);
          ctx.arcTo(x + w, y + h, x, y + h, rr);
          ctx.arcTo(x, y + h, x, y, rr);
          ctx.arcTo(x, y, x + w, y, rr);
          ctx.closePath();
          ctx.fill();
      }

      // ===== メインループ =====
      // requestAnimationFrameの実際の呼び出し間隔（dtMs）を60fps基準の倍率に変換し、
      // ゲームの進み方が端末やタブの状態（背景スロットリング等）に左右されないようにする。
      let lastTimestamp = null;
      function loop(timestamp) {
          if (lastTimestamp === null) lastTimestamp = timestamp;
          const dtMs = timestamp - lastTimestamp;
          lastTimestamp = timestamp;
          // 極端に大きい値（タブが長時間非アクティブだった直後など）はクランプし、
          // 復帰した瞬間に鳥が障害物をすり抜けたりしないようにする。
          const dt = Math.max(0, Math.min(dtMs / (1000 / 60), 3));

          if (running) update(dt);
          render();
          requestAnimationFrame(loop);
      }

      init();
    </script>

    <script src="bootstrap.bundle.min.js"></script>
    <script src="sidebars.js"></script>
  </body>
</html>
