    <script>
      function escapeHtml(text) {
          const div = document.createElement("div");
          div.textContent = text == null ? "" : String(text);
          return div.innerHTML;
      }
      function outcomeStyle(outcome) {
          if (outcome === "correct") return "background-color: var(--c-primary); color:#fff;";
          if (outcome === "wrong") return "background-color: var(--c-quick); color:#fff;";
          return "background-color: var(--c-border); color: var(--c-text);";
      }
      function outcomeLabel(outcome) {
          if (outcome === "correct") return "✅ 正解";
          if (outcome === "wrong") return "❌ 不正解";
          return "➖ スルー";
      }

      let resultData = null;
      try { resultData = JSON.parse(localStorage.getItem("medetyPlayLastResult") || "null"); } catch (e) { resultData = null; }

      if (!resultData || !Array.isArray(resultData.quizHistory) || resultData.quizHistory.length === 0) {
          document.getElementById("presultEmpty").style.display = "block";
      } else {
          document.getElementById("presultBody").style.display = "block";

          document.getElementById("presultMeta").textContent =
              `難易度：${resultData.difficultyLabel || "-"}　スコア：${resultData.score ?? 0}点`;

          const counts = { correct: 0, wrong: 0, skipped: 0 };
          resultData.quizHistory.forEach(q => { counts[q.outcome] = (counts[q.outcome] || 0) + 1; });
          document.getElementById("countCorrect").textContent = counts.correct || 0;
          document.getElementById("countWrong").textContent = counts.wrong || 0;
          document.getElementById("countSkipped").textContent = counts.skipped || 0;

          document.getElementById("presultList").innerHTML = resultData.quizHistory.map((q, i) => `
              <div class="card border-0 shadow-sm presult-item p-3 mb-2">
                <div class="d-flex justify-content-between align-items-start gap-2">
                  <div>
                    <div class="small text-muted">Q${i + 1}</div>
                    <div class="fw-bold">${escapeHtml(q.prompt)}</div>
                    <div class="small mt-1">正解：<span class="fw-bold">${escapeHtml(q.correctAnswer)}</span></div>
                  </div>
                  <span class="presult-badge" style="${outcomeStyle(q.outcome)}">${outcomeLabel(q.outcome)}</span>
                </div>
                <div class="presult-options">
                  ${(q.options || []).map(opt => `
                    <span class="presult-opt${opt === q.correctAnswer ? " is-correct-answer" : ""}">${escapeHtml(opt)}</span>
                  `).join("")}
                </div>
              </div>
          `).join("");
      }
    </script>
