    <script>
      function escapeHtml(text) {
          return String(text == null ? "" : text).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      const SEARCH_RESULT_LIMIT = 80;
      let searchAllWords = [];
      let searchTagToMeaning = {};

      function matchesQuery(w, rawQuery, lowerQuery) {
          if (w.word && w.word.toLowerCase().includes(lowerQuery)) return true;
          if (w.meaning && w.meaning.includes(rawQuery)) return true;
          if (w.note && w.note.includes(rawQuery)) return true;
          if (Array.isArray(w.etymology_tags)) {
              for (const tag of w.etymology_tags) {
                  if (tag && tag.toLowerCase().includes(lowerQuery)) return true;
                  const tagMeaning = searchTagToMeaning[tag];
                  if (tagMeaning && tagMeaning.includes(rawQuery)) return true;
              }
          }
          return false;
      }

      function renderResultCard(w) {
          const note = w.note ? String(w.note).trim() : "";
          const levelLabel = COURSE_LEVEL_LABELS[medetyWordLevelKey(w)] || "";
          const tags = Array.isArray(w.etymology_tags) ? w.etymology_tags.filter(Boolean) : [];
          return `
              <div class="search-result-row">
                <div style="min-width:0;">
                  <div class="search-result-en">${escapeHtml(w.word)}</div>
                  <div class="search-result-jp">${escapeHtml(w.meaning)}</div>
                  ${tags.length ? `<div class="search-result-tags">${tags.map(t => `<span class="search-tag-pill">${escapeHtml(t)}${searchTagToMeaning[t] ? "（" + escapeHtml(searchTagToMeaning[t]) + "）" : ""}</span>`).join("")}</div>` : ""}
                  ${note ? `<div class="medety-note">💡 ${escapeHtml(note)}</div>` : ""}
                  <div class="search-result-meta">${escapeHtml(w.field || "")}${w.field && levelLabel ? " ・ " : ""}${escapeHtml(levelLabel)}</div>
                </div>
                <button type="button" class="search-speak-btn" data-word="${escapeHtml(w.word)}" aria-label="発音を聞く">🔊</button>
              </div>
          `;
      }

      function runSearch() {
          const rawQuery = document.getElementById("searchInput").value.trim();
          const statusEl = document.getElementById("searchStatus");
          const resultsEl = document.getElementById("searchResults");

          if (!rawQuery) {
              statusEl.textContent = "";
              resultsEl.innerHTML = "";
              return;
          }

          const lowerQuery = rawQuery.toLowerCase();
          const matches = searchAllWords.filter(w => matchesQuery(w, rawQuery, lowerQuery));

          if (matches.length === 0) {
              statusEl.textContent = "見つかりませんでした";
              resultsEl.innerHTML = "";
              return;
          }

          statusEl.textContent = matches.length > SEARCH_RESULT_LIMIT
              ? `${matches.length}件見つかりました（先頭${SEARCH_RESULT_LIMIT}件を表示）`
              : `${matches.length}件見つかりました`;

          resultsEl.innerHTML = matches.slice(0, SEARCH_RESULT_LIMIT).map(renderResultCard).join("");

          resultsEl.querySelectorAll(".search-speak-btn").forEach(btn => {
              btn.addEventListener("click", () => medetySpeak(btn.dataset.word));
          });
      }

      async function init() {
          try {
              const data = await loadMedetyData();
              if (!data || !data.words) throw new Error("no data");
              searchAllWords = data.words;
              (data.etymology || []).forEach(e => { if (e.tag) searchTagToMeaning[e.tag] = e.meaning; });

              document.getElementById("searchLoading").style.display = "none";
              document.getElementById("searchInput").addEventListener("input", runSearch);
              document.getElementById("searchInput").focus();
          } catch (e) {
              console.error("検索データの読み込みに失敗:", e);
              document.getElementById("searchLoading").textContent = "読み込みに失敗しました。時間をおいて再度お試しください。";
          }
      }

      // 検索結果のコピー・右クリックメニュー・ドラッグ選択を無効化する
      // （気軽なコピペを防ぐための簡易的な対策。データ自体の保護にはならない点に注意）
      const searchResultsEl = document.getElementById("searchResults");
      searchResultsEl.addEventListener("copy", (e) => e.preventDefault());
      searchResultsEl.addEventListener("contextmenu", (e) => e.preventDefault());
      searchResultsEl.addEventListener("dragstart", (e) => e.preventDefault());

      init();
    </script>
